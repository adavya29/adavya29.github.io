<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0a0b12">
<title>Adavya — Activating access</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;color:#f5f7ff;background:radial-gradient(circle at top,#25284b,#0a0b12 65%)}main{width:min(100%,430px);padding:30px 24px;text-align:center;border:1px solid #ffffff26;border-radius:24px;background:#ffffff0c;box-shadow:0 20px 70px #0008}.icon{font-size:42px}h1{margin:12px 0;font-size:24px}p{color:#c4c8dc;line-height:1.6}.small{font-size:12px;opacity:.7}</style>
</head>
<body>
<main>
  <div class="icon">🔓</div>
  <h1 id="heading">Activating access…</h1>
  <p id="message">Please wait while we activate your 28-day access.</p>
  <p class="small">Adavya Study Hub · access validity: 28 days</p>
</main>
<script>
(function(){
  const ACCESS_KEY = "adavya_vp_batch_access_until_v1";
  const ACCESS_DURATION = 28 * 24 * 60 * 60 * 1000;
  try {
    const expiry = Date.now() + ACCESS_DURATION;
    localStorage.setItem(ACCESS_KEY, String(expiry));
    document.getElementById("heading").textContent = "Access activated!";
    document.getElementById("message").textContent = "Your batch access is active for 28 days. Returning to Adavya…";
    setTimeout(function(){ window.location.replace("https://adavya29.github.io/"); }, 1400);
  } catch (error) {
    document.getElementById("heading").textContent = "Could not activate access";
    document.getElementById("message").textContent = "Browser storage is unavailable. Enable site storage and try again.";
  }
})();
</script>
</body>
</html>
