<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><title>Adavya — Unlocking access</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;color:#f5f7ff;background:radial-gradient(circle at top,#25284b,#0a0b12 65%)}main{width:min(100%,430px);padding:30px 24px;text-align:center;border:1px solid #ffffff26;border-radius:24px;background:#ffffff0c;box-shadow:0 20px 70px #0008}.icon{font-size:42px}h1{margin:12px 0;font-size:24px}p{color:#c4c8dc;line-height:1.6}.small{font-size:12px;opacity:.7}</style></head><body><main><div class="icon">🔓</div><h1 id="heading">Activating access…</h1><p id="message">Please wait while we return you to Adavya.</p><p class="small">Adavya Study Hub · monthly reset on the 5th</p></main><script>(function(){const ACCESS_KEY="adavya_vp_batch_access_until_v1";function nextResetTimestamp(now){const reset=new Date(now.getFullYear(),now.getMonth(),5,0,0,0,0);if(now.getTime()>=reset.getTime())reset.setMonth(reset.getMonth()+1);return reset.getTime();}try{localStorage.setItem(ACCESS_KEY,String(nextResetTimestamp(new Date())));document.getElementById("heading").textContent="Access activated!";document.getElementById("message").textContent="Returning to Adavya. Batch access stays active until the next monthly reset on the 5th in this same browser.";setTimeout(function(){window.location.replace("/");},1400);}catch(e){document.getElementById("heading").textContent="Could not activate access";document.getElementById("message").textContent="Browser storage is unavailable. Please enable site storage and try again.";}})();</script></body></html>
