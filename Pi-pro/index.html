<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Pro | Adavya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080910;
      color: white;
      font-family: system-ui, sans-serif;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
    #message {
      padding: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="message">Checking Pi Pro access…</div>

  <script>
    (() => {
      const key = "adavya_pipro_access_until_v1";
      const until = Number(localStorage.getItem(key) || 0);

      if (Date.now() >= until) {
        location.replace("/");
        return;
      }

      document.getElementById("message").remove();

      const frame = document.createElement("iframe");
      frame.src = "https://pi-pro.space-z.ai/";
      frame.title = "Pi Pro";
      frame.allow = "fullscreen";
      document.body.appendChild(frame);
    })();
  </script>
</body>
</html>
