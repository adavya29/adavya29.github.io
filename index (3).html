<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <meta name="robots" content="noindex, nofollow">
  <title>Adavya Study Hub — Under Maintenance</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7f7ff;background:radial-gradient(ellipse at 18% 12%,rgba(91,86,255,.25),transparent 38%),radial-gradient(ellipse at 85% 85%,rgba(231,91,190,.16),transparent 35%),#090b16}
    .card{width:min(100%,560px);text-align:center;padding:clamp(28px,6vw,52px);border:1px solid rgba(255,255,255,.13);border-radius:28px;background:rgba(255,255,255,.055);backdrop-filter:blur(18px);box-shadow:0 24px 80px rgba(0,0,0,.38)}
    .logo{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:22px;font-size:30px;font-weight:800;background:linear-gradient(135deg,#7478ff,#e879d5);box-shadow:0 8px 32px #7775ff44}
    .eyebrow{margin:24px 0 10px;color:#b7baff;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}h1{margin:0;font-size:clamp(30px,7vw,44px);line-height:1.12;letter-spacing:-.04em}h1 span{background:linear-gradient(90deg,#9ba2ff,#f0a2df);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{margin:18px auto 0;max-width:410px;color:#c2c5d7;line-height:1.75;font-size:15px}.status{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:10px 14px;border-radius:999px;border:1px solid #ffffff1c;background:#ffffff08;color:#e7e8f5;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#f3c969;box-shadow:0 0 12px #f3c96999;animation:pulse 1.6s infinite}.footer{margin-top:34px;color:#777d99;font-size:12px;letter-spacing:.04em}@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-label="Adavya">A</div>
    <div class="eyebrow">Adavya Study Hub</div>
    <h1>We’ll be back <span>soon.</span></h1>
    <p>We’re making a few improvements to bring you a smoother study experience. The website is temporarily under maintenance.</p>
    <div class="status"><span class="dot"></span> Maintenance in progress</div>
    <p>Thank you for your patience and support. Keep learning, keep growing. ✨</p>
    <div class="footer">STUDY SMARTER, ACHIEVE BEYOND</div>
  </main>
</body>
</html>
